<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1940" viewBox="0 0 1320 1940" role="img" aria-labelledby="title desc">
  <title id="title">海大网络助手 1.3 界面规划：网络识别、在线设备、恢复记录与设置</title>
  <desc id="desc">五屏布局示意，保留蓝白圆角卡片与原创双海浪。顶部仅显示实际 Wi-Fi 名称，不提供选择入口。包含非校园网、在线六字段、其他在线设备、恢复记录及 XHA 请求统计、设置说明。所有账号、地址、时间、次数均为虚构演示数据，并非真机画面。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17334d; }
      .heading { font-size: 28px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .value { font-size: 15px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .muted { fill: #536d83; }
      .blue { fill: #004098; }
      .green { fill: #087b63; }
      .red { fill: #b42318; }
      .bold { font-weight: 700; }
      .card { fill: #fff; stroke: #dce6ed; stroke-width: 1; }
      .divider { stroke: #e5edf2; stroke-width: 1; }
    </style>
    <g id="wifi" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M0 6 Q10 -3 20 6 M4 11 Q10 5 16 11 M8 16 Q10 14 12 16"/>
      <circle cx="10" cy="20" r="1.3" fill="currentColor" stroke="none"/>
    </g>
    <g id="wave" fill="none" stroke-linecap="round">
      <path d="M0 9 C6 0 13 0 20 9 S33 18 40 9" stroke="#004098" stroke-width="3"/>
      <path d="M0 18 C6 9 13 9 20 18 S33 27 40 18" stroke="#00a0e9" stroke-width="3"/>
    </g>
    <g id="phone">
      <rect width="390" height="800" rx="30" fill="#fff" stroke="#bacbd8" stroke-width="2"/>
      <rect x="8" y="8" width="374" height="784" rx="24" fill="#f5f8fb"/>
      <text x="30" y="36" class="small bold">10:19</text>
      <path d="M307 30 h4 m4 0 h4 m4 0 h4" stroke="#536d83" stroke-width="3" stroke-linecap="round"/>
      <rect x="336" y="24" width="22" height="11" rx="3" fill="none" stroke="#536d83" stroke-width="1.5"/>
      <rect x="339" y="27" width="15" height="5" rx="1" fill="#536d83"/>
      <rect x="24" y="56" width="342" height="56" rx="14" fill="#edf4f9"/>
      <use href="#wifi" x="41" y="70" color="#004098"/>
      <use href="#wave" x="26" y="134"/>
      <text x="78" y="148" class="body bold blue">海大网络助手</text>
      <text x="78" y="171" class="small muted">校园网络辅助工具 · 独立开发</text>
      <line x1="24" y1="747" x2="366" y2="747" class="divider"/>
      <text x="195" y="767" text-anchor="middle" class="tiny muted">免费软件，仅用于学习交流</text>
      <rect x="141" y="781" width="108" height="4" rx="2" fill="#9eb1c0"/>
    </g>
    <g id="nav-overview">
      <text x="42" y="733" class="small blue bold">连接概览</text><text x="167" y="733" class="small muted">恢复记录</text><text x="306" y="733" class="small muted">设置</text>
    </g>
    <g id="nav-recovery">
      <text x="42" y="733" class="small muted">连接概览</text><text x="167" y="733" class="small blue bold">恢复记录</text><text x="306" y="733" class="small muted">设置</text>
    </g>
    <g id="nav-settings">
      <text x="42" y="733" class="small muted">连接概览</text><text x="167" y="733" class="small muted">恢复记录</text><text x="306" y="733" class="small blue bold">设置</text>
    </g>
  </defs>

  <rect width="1320" height="1940" fill="#edf3f8"/>
  <text x="30" y="48" class="heading">海大网络助手 · 下一版界面规划</text>
  <text x="30" y="80" class="body muted">只读 Wi-Fi · 先识别校园网 · 设备信息可展开 · 请求负载看得见</text>
  <text x="30" y="117" class="body bold">01  非校园网 · 清晰说明状态</text>
  <text x="465" y="117" class="body bold">02  校园网在线 · 本机信息优先</text>
  <text x="900" y="117" class="body bold">03  二级页面 · 其他在线设备</text>

  <!-- 顶部 SSID 只有图标与真实名称，没有下拉箭头或选择入口。 -->
  <g transform="translate(30 138)" data-screen="non-campus">
