<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1000" viewBox="0 0 1320 1000" role="img" aria-labelledby="title desc">
  <title id="title">海大网络助手 1.2 界面规划示意：在线、连接中与恢复记录</title>
  <desc id="desc">三屏 Android 布局草图。顶部为 Wi-Fi 选择，下方是小型海大品牌、连接概览、账号、监测与本次启动以来的恢复统计。所有账号与地址为脱敏演示数据，离线不展示会话信息。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17334d; }
      .heading { font-size: 28px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .muted { fill: #536d83; }
      .blue { fill: #004098; }
      .green { fill: #087b63; }
      .amber { fill: #8c5900; }
      .bold { font-weight: 700; }
      .card { fill: #fff; stroke: #dce6ed; stroke-width: 1; }
      .divider { stroke: #e5edf2; stroke-width: 1; }
    </style>
    <g id="wifi" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M0 6 Q10 -3 20 6 M4 11 Q10 5 16 11 M8 16 Q10 14 12 16"/>
      <circle cx="10" cy="20" r="1.3" fill="currentColor" stroke="none"/>
    </g>
    <g id="wave" fill="none" stroke-linecap="round">
      <path d="M0 9 C6 0 13 0 20 9 S33 18 40 9" stroke="#004098" stroke-width="3"/>
      <path d="M0 18 C6 9 13 9 20 18 S33 27 40 18" stroke="#00a0e9" stroke-width="3"/>
    </g>
    <g id="chevron" fill="none" stroke="#536d83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0 L5 5 L10 0"/></g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 5 L4 9 L11 0"/></g>
  </defs>

  <rect width="1320" height="1000" fill="#edf3f8"/>
  <text x="30" y="48" class="heading">界面规划示意 · 演示数据</text>
  <text x="30" y="80" class="body muted">海大网络助手 1.2  /  网络选择置顶 · 会话信息优先 · 恢复结果可追溯</text>
